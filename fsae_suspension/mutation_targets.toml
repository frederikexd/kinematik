# Files held to the per-file mutation floor, grouped with the tests that pin them.
#
# scripts/mutation_gate.py runs one group at a time: it points [tool.mutmut] in pyproject.toml at the group's files
# and tests, runs mutmut, and fails if any file in the group scores under `floor` (killed / tested, the same
# definition mutmut uses). .github/workflows/mutation.yml runs the groups a push touches, and every group monthly.
# A file joins by getting a group here once it has reached the floor; files not listed are measured by the manual
# baseline run (workflow_dispatch with baseline: true) and are not held to a floor yet.

floor = 99.0

[[group]]
name = "core"
files = ["suspension/kinematics.py", "suspension/loadpath.py"]
floor = 99.0        # 100% measured 2026-10-23 (1679 of 1679); a group may hold itself above the shared floor
tests = [
    "tests/test_kinematics.py",
    "tests/test_load_case_physics.py",
    "tests/test_invariants_property.py",
    "tests/test_core_solver_edges.py",
    "tests/test_lotus_benchmark.py",
    "tests/test_adams_view_benchmark.py",
    "tests/test_motion_ratio_antidive.py",
    "tests/test_accuracy_invariants.py",
    "tests/test_actuation.py",
    "tests/test_mutation_gaps.py",
]
# two full actuation syntheses (about 25 s each) would run against every mutant of the solver
deselect = ["tests/test_actuation.py::test_synthesis_meets_every_band"]

[[group]]
name = "compliance"
files = ["suspension/elastokinematics.py", "suspension/compliance.py"]
tests = [
    "tests/test_compliance.py",
    "tests/test_elastokinematics.py",
    "tests/test_core_solver_edges.py",
    "tests/test_load_case_physics.py",
    "tests/test_mutation_compliance.py",
]
deselect = []

