# OpenSSF Scorecard: an independent, automated review of this repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, code review, fuzzing, signed releases and more).
# Results appear under Security -> Code scanning and on https://scorecard.dev for the public badge.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '37 3 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results for the badge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          sarif_file: results.sarif
