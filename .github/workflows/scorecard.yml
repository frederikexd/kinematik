# OpenSSF Scorecard: an independent, automated review of this repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, code review, fuzzing, signed releases and more).
# Results appear under Security -> Code scanning and on https://scorecard.dev for the public badge.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '37 3 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: results.sarif
