# Correctness lint (ruff, the rule set in fsae_suspension/pyproject.toml). Every selected rule is held at zero
# findings; the version is pinned so a new ruff release cannot turn the badge red without a code change.
name: lint

on: [push, pull_request]

# The token can read the repository and nothing else; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.16.8
      - name: Lint
        working-directory: fsae_suspension
        run: ruff check . --output-format github
