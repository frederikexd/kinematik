# Correctness lint (ruff, the rule set in fsae_suspension/pyproject.toml). Every selected rule is held at zero
# findings; the version is pinned so a new ruff release cannot turn the badge red without a code change.
name: lint

# Pushes run on main only; any other branch runs through its pull request, so a change is never checked twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token can read the repository and nothing else; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.16.8
      - name: Lint
        working-directory: fsae_suspension
        run: ruff check . --output-format github
