# Dependency vulnerabilities (pip-audit against the PyPI advisory database) and a source security
# lint (bandit, failing on any medium or high finding). Runs on every push without an account or token.
name: security

# Pushes run on main only; any other branch runs through its pull request, so a change is never checked twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token can read the repository and nothing else; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install pip-audit==2.10.1 bandit==1.9.4
      # Pillow advisories fixed only in Pillow 13, which Streamlit (<13) does not yet allow. KinematiK opens no
      # image itself; the one route in is a texture inside an uploaded mesh, and suspension/image_safety.py removes
      # every decoder but PNG and JPEG (and the PDF writer) before any mesh is loaded, which closes all eight
      # (TIFF, GIF, PPM/PGM, EPS, PDF append). tests/test_image_safety.py holds that true. Remove these ignores
      # once Streamlit allows Pillow 13.
      - name: Known vulnerabilities in the dependencies
        run: >-
          pip-audit -r requirements.txt -r fsae_suspension/requirements.txt
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112899
      - name: Source security lint (medium and high severity)
        run: bandit -r fsae_suspension -x fsae_suspension/tests -ll -q
