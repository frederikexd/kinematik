# CodeQL code scanning (the engine LGTM.com ran before GitHub retired it in December 2022).
# Alerts appear under the repository's Security tab -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

# The token can read the repository and nothing else; a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # The 30k-line app plus the test suite pushed analysis past 30 min (run #146); tests and fixtures are not
    # shipped code, so they are left out of the scan and the limit has headroom.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: python
          build-mode: none
          config: |
            paths-ignore:
              - '**/tests/**'
              - '**/_attic/**'
              - '**/benchmarks/**'
              - 'notebooks/**'
              - 'docs/**'
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: /language:python
