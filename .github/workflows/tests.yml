name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest pytest-xdist
      - name: Install local package and run tests
        run: |
          pip install -e './fsae_suspension[excel,cad,pdf,cloud,drive]'
          pytest fsae_suspension/tests/ \
            --ignore=fsae_suspension/tests/test_voice_memo.py \
            -n auto -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/fsae_suspension
