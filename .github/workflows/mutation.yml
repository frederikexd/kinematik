# Mutation testing of the core solvers (the [tool.mutmut] section of fsae_suspension/pyproject.toml).
# mutmut makes small deliberate errors in suspension/kinematics.py and suspension/loadpath.py (a flipped sign, a swapped
# operator, an off-by-one) and runs the kinematics, statics, property and benchmark suites against each one. A mutant the
# tests catch is "killed"; one they miss "survives". The score is the share killed, and it is held at or above the floor
# below, so the tests cannot quietly lose their teeth. Too slow for every push: monthly, on demand, and when the two
# mutated files or their tests change on main.
name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'
  push:
    branches: [main]
    paths:
      - 'fsae_suspension/suspension/kinematics.py'
      - 'fsae_suspension/suspension/loadpath.py'
      - 'fsae_suspension/tests/test_kinematics.py'
      - 'fsae_suspension/tests/test_load_case_physics.py'
      - 'fsae_suspension/tests/test_invariants_property.py'
      - 'fsae_suspension/tests/test_core_solver_edges.py'
      - 'fsae_suspension/tests/test_motion_ratio_antidive.py'
      - 'fsae_suspension/tests/test_accuracy_invariants.py'
      - 'fsae_suspension/tests/test_actuation.py'
      - 'fsae_suspension/tests/test_mutation_gaps.py'
      - 'fsae_suspension/pyproject.toml'
      - '.github/workflows/mutation.yml'

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # 100% measured 2026-10-23 (1679 of 1679 caught); it was 93.7% before the equivalent mutants were marked and
      # 74.8% before tests/test_mutation_gaps.py. 99 leaves room for one equivalent mutant a later edit brings in.
      FLOOR: '99'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ./fsae_suspension pytest hypothesis 'mutmut>=3.2'
      - name: Mutate the kinematics and statics and run the tests against each mutant
        working-directory: fsae_suspension
        run: mutmut run --max-children 4 || true
      - name: Score
        working-directory: fsae_suspension
        run: |
          mutmut export-cicd-stats
          python - <<'PY'
          import json, os
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          tested = int(s.get("total", 0)) - int(s.get("skipped", 0))       # mutmut's own score definition
          score = 100.0 * (int(s.get("killed", 0)) + int(s.get("timeout", 0))) / tested if tested else 0.0
          floor = float(os.environ["FLOOR"])
          line = (f"Mutation score {score:.1f}% ({s['killed']} killed, {s['survived']} survived, "
                  f"{s.get('timeout', 0)} timed out, {s.get('no_tests', 0)} with no test); floor {floor:.1f}%")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(line + "\n")
          raise SystemExit(0 if score >= floor else 1)
          PY
      - name: List surviving mutants
        if: always()
        working-directory: fsae_suspension
        run: mutmut results > survivors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-survivors
          path: fsae_suspension/survivors.txt
