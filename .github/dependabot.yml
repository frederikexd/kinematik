# Dependabot opens a pull request when a dependency or a pinned GitHub Action has a newer release or a security fix.
# Every pull request runs the full gates (tests, lint, security, mutation where it applies) before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # requirements.txt states minimum versions (>=), so the app already installs the newest release. Raising a
  # minimum adds nothing, so Dependabot only steps in when a release falls outside the stated range, and then in
  # one grouped pull request. Security fixes still arrive through Dependabot security updates.
  - package-ecosystem: pip
    directories: ['/', '/fsae_suspension']
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ['*']
  # The Python version in the image moves only when it is chosen on purpose (scientific wheels lag new releases).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
